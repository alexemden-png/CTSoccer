<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <meta charset="UTF-8">
  <script src="theme.js"></script>
  <script src="cookie-consent.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Suggest a Club or Correction — CT Soccer</title>
  <meta name="description" content="Suggest a club to add to CT Soccer, or report an issue with an existing club page.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://ctsoccerhub.com/suggest.html">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --navy:     #0D1B2A;
      --navy-800: #111f31;
      --accent:   #2B7CE9;
      --accent-lt:#5BA3F5;
      --muted:    rgba(255,255,255,.38);
    }
    html[data-theme="light"] { filter: invert(1) hue-rotate(180deg); }
    html[data-theme="light"] img, html[data-theme="light"] video, html[data-theme="light"] canvas, html[data-theme="light"] iframe { filter: invert(1) hue-rotate(180deg); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', Arial, sans-serif; background: var(--navy); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 900px 600px at 20% 10%, rgba(43,124,233,.13) 0%, transparent 70%); pointer-events: none; }
    .card { background: var(--navy-800); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 40px; max-width: 520px; width: 100%; position: relative; margin-top: 32px; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
    input, select, textarea {
      width: 100%; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
      padding: 12px 14px; font-size: .9rem; color: #fff; font-family: 'Montserrat', Arial, sans-serif; outline: none;
      transition: border-color .2s; box-sizing: border-box;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,.25); }
    select option { background: #111f31; color: #fff; }
    textarea { resize: vertical; min-height: 100px; }
    label.field-label { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.38); display: block; margin-bottom: 6px; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg,#2B7CE9 0%,#1a5cb8 100%); color: #fff; font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 700; font-size: .925rem; padding: 13px 20px; border-radius: 11px; border: none; cursor: pointer;
      width: 100%; transition: opacity .18s, transform .18s; box-shadow: 0 4px 18px rgba(43,124,233,.38);
    }
    .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .5; cursor: default; transform: none; }
  </style>
</head>
<body>
  <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark theme" style="position:fixed;top:20px;right:20px;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;z-index:50;"><span class="theme-toggle-icon">&#9728;&#65039;</span></button>

  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
        <div style="width:42px;height:42px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:4px;">
          <img src="logo.png" alt="CT Soccer" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div>
          <div style="font-size:1.1rem;font-weight:800;letter-spacing:-.025em;color:#fff;" id="page-title">Suggest a Club or Correction</div>
          <div style="font-size:.75rem;color:var(--muted);">We read every submission.</div>
        </div>
      </a>
    </div>

    <form id="suggest-form" style="display:flex;flex-direction:column;gap:16px;">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_subject" value="CT Soccer: new suggestion submission">

      <div>
        <label class="field-label">What is this about?</label>
        <select name="Type" id="s-type" onchange="updateFields()">
          <option value="Correction">Correct information on an existing club page</option>
          <option value="New Club">Suggest a new club to add</option>
          <option value="Other">Something else</option>
        </select>
      </div>

      <div>
        <label class="field-label" id="club-field-label">Club Name</label>
        <input type="text" name="Club" id="s-club" placeholder="e.g. Hartford Athletic">
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label class="field-label">Your Name <span style="text-transform:none;font-weight:600;">(optional)</span></label>
          <input type="text" name="Name" placeholder="Your name">
        </div>
        <div>
          <label class="field-label">Email</label>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div>
        <label class="field-label" id="message-field-label">What should we know?</label>
        <textarea name="Message" placeholder="Describe the issue, or tell us about the club you'd like added (city, league/age groups, website, contact info if you have it)." required></textarea>
      </div>

      <div id="s-status" style="font-size:.82rem;color:rgba(255,255,255,.4);"></div>

      <button type="submit" class="btn-primary" id="s-btn">Send Suggestion</button>
    </form>

    <p style="text-align:center;font-size:.78rem;color:rgba(255,255,255,.28);margin:20px 0 0;">
      <a href="index.html" style="color:var(--accent-lt);text-decoration:none;font-weight:700;">&larr; Back to CT Soccer</a>
    </p>
  </div>

  <script>
    // Reuses the same FormSubmit mechanism as the main Contact form (see
    // index.html) rather than a separate email pipeline — just a different
    // fixed destination address for this specific form.
    const SUGGEST_EMAIL = 'info@ctsoccerhub.com';
    const form = document.getElementById('suggest-form');
    form.action = 'https://formsubmit.co/' + SUGGEST_EMAIL;
    form.method = 'POST';

    const params = new URLSearchParams(location.search);
    const typeSelect = document.getElementById('s-type');
    const clubInput = document.getElementById('s-club');
    if (params.get('type') === 'new-club') typeSelect.value = 'New Club';
    else if (params.get('type') === 'correction') typeSelect.value = 'Correction';
    if (params.get('club')) clubInput.value = params.get('club');

    function updateFields() {
      const type = typeSelect.value;
      const clubLabel = document.getElementById('club-field-label');
      const msgLabel = document.getElementById('message-field-label');
      if (type === 'New Club') {
        clubLabel.textContent = 'Club Name to Add';
        clubInput.placeholder = 'e.g. Your Town Soccer Club';
        msgLabel.textContent = 'Tell us about the club';
        clubInput.required = true;
      } else if (type === 'Correction') {
        clubLabel.textContent = 'Which Club Page?';
        clubInput.placeholder = 'e.g. Hartford Athletic';
        msgLabel.textContent = "What's incorrect or missing?";
        clubInput.required = true;
      } else {
        clubLabel.textContent = 'Related Club (if any)';
        clubInput.placeholder = 'Optional';
        msgLabel.textContent = 'What should we know?';
        clubInput.required = false;
      }
    }
    updateFields();

    // FormSubmit needs a plain, non-app _next redirect target so it can
    // append ?sent=1 to it after a real form POST — build it once we know
    // the current page's own URL, same pattern as the main Contact form.
    (function () {
      const next = document.createElement('input');
      next.type = 'hidden';
      next.name = '_next';
      next.value = window.location.origin + window.location.pathname + '?sent=1';
      form.appendChild(next);
    })();

    form.addEventListener('submit', () => {
      const btn = document.getElementById('s-btn');
      btn.textContent = 'Sending…';
      btn.disabled = true;
    });

    if (params.get('sent') === '1') {
      const status = document.getElementById('s-status');
      status.textContent = 'Thanks — your suggestion was sent!';
      status.style.color = '#5CDD8B';
      history.replaceState(null, '', window.location.pathname);
    }
  </script>
</body>
</html>
