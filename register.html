<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="theme.js"></script>
  <script src="cookie-consent.js"></script>
  <script src="auth.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Join CT Soccer — Create Your Free Account</title>
  <meta name="description" content="Create a free CT Soccer account to follow clubs, join the community, and manage your player or team profile.">
  <link rel="canonical" href="https://ctsoccerhub.com/register.html">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    :root {
      --navy:     #0D1B2A;
      --navy-800: #111f31;
      --accent:   #2B7CE9;
      --accent-lt:#5BA3F5;
      --muted:    rgba(255,255,255,.38);
    }
    html[data-theme="light"] { filter: invert(1) hue-rotate(180deg); }
    html[data-theme="light"] img, html[data-theme="light"] video, html[data-theme="light"] canvas, html[data-theme="light"] iframe { filter: invert(1) hue-rotate(180deg); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: var(--navy);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 900px 600px at 20% 10%, rgba(43,124,233,.13) 0%, transparent 70%),
        radial-gradient(ellipse 700px 500px at 80% 90%, rgba(43,124,233,.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: var(--navy-800);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      position: relative;
      box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 1px rgba(43,124,233,.1);
    }
    input, select {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: .9rem;
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
      outline: none;
      transition: border-color .2s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: rgba(255,255,255,.25); }
    select option { background: #111f31; color: #fff; }
    label.field-label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.38);
      display: block;
      margin-bottom: 6px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg,#2B7CE9 0%,#1a5cb8 100%);
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 700;
      font-size: .925rem;
      padding: 13px 20px;
      border-radius: 11px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: opacity .18s, transform .18s;
      box-shadow: 0 4px 18px rgba(43,124,233,.38);
    }
    .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-primary:disabled:hover { opacity: .4; transform: none; }
    .role-opt {
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
    }
    .role-opt.selected {
      border-color: rgba(43,124,233,.5);
      background: rgba(43,124,233,.08);
    }
    .role-opt.selected .role-label { color: var(--accent-lt); }
    .role-label { font-size: .8rem; font-weight: 700; color: rgba(255,255,255,.5); transition: color .2s; }
    .mobile-app-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 20px;
      background: rgba(13, 27, 42, 0.92);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35), 0 0 1px rgba(255,255,255,0.1);
    }
    .mobile-app-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 52px;
      border-radius: 14px;
      text-decoration: none;
      color: rgba(255,255,255,0.6);
      font-size: 10px;
      font-weight: 700;
      transition: all .25s cubic-bezier(.16, 1, .3, 1);
    }
    .mobile-app-item:active {
      transform: scale(0.92);
    }
    .mobile-app-item.active {
      background: linear-gradient(135deg, rgba(43,124,233,0.18) 0%, rgba(43,124,233,0.08) 100%);
      color: #7AC9FF;
      box-shadow: 0 8px 16px rgba(43,124,233,0.2);
    }
    .mobile-app-item svg { width: 18px; height: 18px; }
    @media (max-width: 480px) {
      body {
        padding: 16px 16px 88px;
      }
      .card {
        padding: 24px 18px;
        border-radius: 18px;
      }
      .card > div:first-child {
        gap: 10px;
        margin-bottom: 22px;
      }
      .card > div:first-child img {
        width: 36px;
        height: 36px;
      }
      form > div:first-of-type {
        grid-template-columns: 1fr !important;
      }
      .role-opt .role-label {
        font-size: .72rem;
      }
      .btn-primary {
        min-height: 48px;
      }
      .mobile-app-bar {
        display: flex !important;
      }
    }
  </style>
</head>
<body>
  <nav class="mobile-app-bar" aria-label="Mobile app navigation">
    <a class="mobile-app-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 9.5V20h14V9.5"/></svg>
      <span>Home</span>
    </a>
    <a class="mobile-app-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Clubs</span>
    </a>
    <a class="mobile-app-item active" href="register.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Join</span>
    </a>
  </nav>

  <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark theme" style="position:fixed;top:20px;right:20px;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;z-index:50;"><span class="theme-toggle-icon">&#9728;&#65039;</span></button>

  <div class="card">
    <!-- Logo -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px;">
      <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
        <div style="width:42px;height:42px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:4px;">
          <img src="logo.png" alt="CT Soccer" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div>
          <div style="font-size:1.1rem;font-weight:800;letter-spacing:-.025em;color:#fff;">Join CT Soccer</div>
          <div style="font-size:.75rem;color:var(--muted);">Free to join. Takes 2 minutes.</div>
        </div>
      </a>
    </div>

    <form id="register-form" style="display:flex;flex-direction:column;gap:16px;">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label class="field-label">First Name</label>
          <input type="text" id="firstName" placeholder="Alex" required autocomplete="given-name">
        </div>
        <div>
          <label class="field-label">Last Name</label>
          <input type="text" id="lastName" placeholder="Smith" required autocomplete="family-name">
        </div>
      </div>

      <div>
        <label class="field-label">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div>
        <label class="field-label">Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
      </div>

      <div>
        <label class="field-label">I am a...</label>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          <div class="role-opt selected" onclick="selectRole('player',this)">
            <input type="radio" name="role" value="player" checked style="display:none;">
            <div class="role-label" style="color:var(--accent-lt);">⚽ Player</div>
          </div>
          <div class="role-opt" onclick="selectRole('coach',this)">
            <input type="radio" name="role" value="coach" style="display:none;">
            <div class="role-label">📋 Coach</div>
          </div>
          <div class="role-opt" onclick="selectRole('fan',this)">
            <input type="radio" name="role" value="fan" style="display:none;">
            <div class="role-label">🏟️ Fan</div>
          </div>
        </div>
      </div>

      <div id="error-msg" style="display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:9px;padding:11px 14px;font-size:.82rem;color:#fca5a5;"></div>

      <div style="display:flex;gap:9px;background:rgba(43,124,233,.06);border:1px solid rgba(43,124,233,.18);border-radius:10px;padding:11px 14px;">
        <span style="flex-shrink:0;font-size:.9rem;line-height:1.5;">💾</span>
        <p style="font-size:.76rem;line-height:1.6;color:rgba(255,255,255,.55);margin:0;">
          Heads up: your account currently lives in this browser only, not on a server. Clearing your browser data or switching devices will lose it — we'll let you know before that changes.
        </p>
      </div>

      <label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;">
        <input type="checkbox" id="agree-terms" required style="width:16px;height:16px;margin-top:2px;cursor:pointer;accent-color:var(--accent);flex-shrink:0;">
        <span style="font-size:.78rem;color:rgba(255,255,255,.45);line-height:1.6;">
          I agree to the <a href="terms-of-service.html" target="_blank" rel="noopener" style="color:rgba(255,255,255,.7);text-decoration:underline;">Terms of Service</a> and <a href="privacy-policy.html" target="_blank" rel="noopener" style="color:rgba(255,255,255,.7);text-decoration:underline;">Privacy Policy</a>.
        </span>
      </label>

      <button type="submit" class="btn-primary" style="margin-top:4px;" id="create-account-btn" disabled>
        Create My Account
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h9M9 4l3.5 3.5L9 11"/></svg>
      </button>
    </form>

    <p style="text-align:center;font-size:.78rem;color:rgba(255,255,255,.28);margin:20px 0 0;">
      Already a member?
      <a href="login.html" style="color:var(--accent-lt);text-decoration:none;font-weight:700;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Sign in</a>
    </p>
  </div>

  <script>
    // Already logged in → skip to dashboard
    const existing = ctsoccerGetUser();
    if (existing && existing.firstName) window.location.href = 'dashboard.html';

    const agreeCheckbox = document.getElementById('agree-terms');
    const createBtn = document.getElementById('create-account-btn');
    agreeCheckbox.addEventListener('change', () => {
      createBtn.disabled = !agreeCheckbox.checked;
    });

    function selectRole(value, el) {
      document.querySelectorAll('.role-opt').forEach(o => {
        o.classList.remove('selected');
        o.querySelector('.role-label').style.color = 'rgba(255,255,255,.5)';
        o.querySelector('input').checked = false;
      });
      el.classList.add('selected');
      el.querySelector('.role-label').style.color = 'var(--accent-lt)';
      el.querySelector('input').checked = true;
    }

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value.trim();
      const lastName  = document.getElementById('lastName').value.trim();
      const email     = document.getElementById('email').value.trim();
      const password  = document.getElementById('password').value;
      const role      = document.querySelector('input[name="role"]:checked').value;
      const errorEl   = document.getElementById('error-msg');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      if (!agreeCheckbox.checked) {
        errorEl.textContent = 'Please agree to the Terms of Service and Privacy Policy to continue.';
        errorEl.style.display = 'block';
        return;
      }

      if (password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        errorEl.style.display = 'block';
        return;
      }

      const user = {
        firstName, lastName, email, password, role,
        joined: new Date().toISOString(),
        followedClubs: [],
        notifications: true,
        stats: { goals: 0, assists: 0, appearances: 0, rating: '—' }
      };

      if (typeof FIREBASE_READY !== 'undefined' && FIREBASE_READY) {
        submitBtn.disabled = true;
        try {
          const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
          await db.collection('users').doc(cred.user.uid).set({
            uid: cred.user.uid, email, firstName, lastName, role,
            username: null, bio: '', location: '',
            followerCount: 0, followingCount: 0,
            joined: user.joined,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          user.firebaseUid = cred.user.uid;
        } catch (err) {
          submitBtn.disabled = false;
          errorEl.textContent = err.code === 'auth/email-already-in-use'
            ? 'An account with that email already exists. Try signing in instead.'
            : 'Could not create account: ' + err.message;
          errorEl.style.display = 'block';
          return;
        }
      }

      ctsoccerSetUser(user, true);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
