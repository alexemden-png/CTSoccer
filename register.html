<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register "” CT Soccer</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --navy:     #0D1B2A;
      --navy-800: #111f31;
      --accent:   #2B7CE9;
      --accent-lt:#5BA3F5;
      --muted:    rgba(255,255,255,.38);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: var(--navy);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 900px 600px at 20% 10%, rgba(43,124,233,.13) 0%, transparent 70%),
        radial-gradient(ellipse 700px 500px at 80% 90%, rgba(43,124,233,.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: var(--navy-800);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      position: relative;
      box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 1px rgba(43,124,233,.1);
    }
    input, select {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: .9rem;
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
      outline: none;
      transition: border-color .2s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: rgba(255,255,255,.25); }
    select option { background: #111f31; color: #fff; }
    label.field-label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.38);
      display: block;
      margin-bottom: 6px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg,#2B7CE9 0%,#1a5cb8 100%);
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 700;
      font-size: .925rem;
      padding: 13px 20px;
      border-radius: 11px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: opacity .18s, transform .18s;
      box-shadow: 0 4px 18px rgba(43,124,233,.38);
    }
    .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .role-opt {
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
    }
    .role-opt.selected {
      border-color: rgba(43,124,233,.5);
      background: rgba(43,124,233,.08);
    }
    .role-opt.selected .role-label { color: var(--accent-lt); }
    .role-label { font-size: .8rem; font-weight: 700; color: rgba(255,255,255,.5); transition: color .2s; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px;">
      <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
        <div style="width:42px;height:42px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:4px;">
          <img src="logo.png" alt="CT Soccer" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div>
          <div style="font-size:1.1rem;font-weight:800;letter-spacing:-.025em;color:#fff;">Join CT Soccer</div>
          <div style="font-size:.75rem;color:var(--muted);">Free to join. Takes 2 minutes.</div>
        </div>
      </a>
    </div>

    <form id="register-form" style="display:flex;flex-direction:column;gap:16px;">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label class="field-label">First Name</label>
          <input type="text" id="firstName" placeholder="Alex" required autocomplete="given-name">
        </div>
        <div>
          <label class="field-label">Last Name</label>
          <input type="text" id="lastName" placeholder="Smith" required autocomplete="family-name">
        </div>
      </div>

      <div>
        <label class="field-label">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div>
        <label class="field-label">Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
      </div>

      <div>
        <label class="field-label">I am a"¦</label>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          <div class="role-opt selected" onclick="selectRole('player',this)">
            <input type="radio" name="role" value="player" checked style="display:none;">
            <div class="role-label" style="color:var(--accent-lt);">âš½ Player</div>
          </div>
          <div class="role-opt" onclick="selectRole('coach',this)">
            <input type="radio" name="role" value="coach" style="display:none;">
            <div class="role-label">ðŸ“‹ Coach</div>
          </div>
          <div class="role-opt" onclick="selectRole('fan',this)">
            <input type="radio" name="role" value="fan" style="display:none;">
            <div class="role-label">ðŸŸï¸ Fan</div>
          </div>
        </div>
      </div>

      <div id="error-msg" style="display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:9px;padding:11px 14px;font-size:.82rem;color:#fca5a5;"></div>

      <button type="submit" class="btn-primary" style="margin-top:4px;">
        Create My Account
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h9M9 4l3.5 3.5L9 11"/></svg>
      </button>
    </form>

    <p style="text-align:center;font-size:.78rem;color:rgba(255,255,255,.28);margin:20px 0 0;">
      Already a member?
      <a href="login.html" style="color:var(--accent-lt);text-decoration:none;font-weight:700;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Sign in</a>
    </p>
  </div>

  <script>
    // Already logged in â†’ skip to dashboard
    const existing = JSON.parse(localStorage.getItem('ctsoccer_user') || 'null');
    if (existing && existing.firstName) window.location.href = 'dashboard.html';

    function selectRole(value, el) {
      document.querySelectorAll('.role-opt').forEach(o => {
        o.classList.remove('selected');
        o.querySelector('.role-label').style.color = 'rgba(255,255,255,.5)';
        o.querySelector('input').checked = false;
      });
      el.classList.add('selected');
      el.querySelector('.role-label').style.color = 'var(--accent-lt)';
      el.querySelector('input').checked = true;
    }

    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value.trim();
      const lastName  = document.getElementById('lastName').value.trim();
      const email     = document.getElementById('email').value.trim();
      const password  = document.getElementById('password').value;
      const role      = document.querySelector('input[name="role"]:checked').value;
      const errorEl   = document.getElementById('error-msg');

      if (password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        errorEl.style.display = 'block';
        return;
      }

      const user = {
        firstName, lastName, email, password, role,
        joined: new Date().toISOString(),
        followedClubs: [],
        notifications: true,
        stats: { goals: 0, assists: 0, appearances: 0, rating: '"”' }
      };
      localStorage.setItem('ctsoccer_user', JSON.stringify(user));
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
