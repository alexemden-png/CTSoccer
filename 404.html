<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page Not Found — CT Soccer</title>
  <meta name="description" content="This page doesn't exist on CT Soccer. Head back to the homepage or your club dashboard.">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --navy:     #0D1B2A;
      --navy-800: #111f31;
      --accent:   #2B7CE9;
      --accent-lt:#5BA3F5;
      --muted:    rgba(255,255,255,.5);
    }
    html[data-theme="light"] { filter: invert(1) hue-rotate(180deg); }
    html[data-theme="light"] img, html[data-theme="light"] video, html[data-theme="light"] canvas, html[data-theme="light"] iframe { filter: invert(1) hue-rotate(180deg); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: var(--navy);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 900px 600px at 20% 10%, rgba(43,124,233,.14) 0%, transparent 70%),
        radial-gradient(ellipse 700px 500px at 80% 90%, rgba(43,124,233,.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .card { position: relative; max-width: 460px; width: 100%; }
    .logo { width: 52px; height: 52px; border-radius: 13px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 6px; margin: 0 auto 28px; }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .code { font-size: clamp(3.5rem,10vw,5rem); font-weight: 900; letter-spacing: -.04em; line-height: 1; background: linear-gradient(135deg,var(--accent-lt) 0%,var(--accent) 60%,#1a5cb8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
    h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; color: #fff; margin-bottom: 12px; }
    p { font-size: .92rem; line-height: 1.7; color: var(--muted); margin-bottom: 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg,#2B7CE9 0%,#1a5cb8 100%); color: #fff; font-family: 'Montserrat', Arial, sans-serif; font-weight: 700; font-size: .88rem; padding: 12px 22px; border-radius: 11px; text-decoration: none; border: none; cursor: pointer; transition: opacity .18s, transform .18s; box-shadow: 0 4px 18px rgba(43,124,233,.38); }
    .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
    .btn-outline { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.05); color: rgba(255,255,255,.8); font-family: 'Montserrat', Arial, sans-serif; font-weight: 700; font-size: .88rem; padding: 12px 22px; border-radius: 11px; text-decoration: none; border: 1px solid rgba(255,255,255,.14); cursor: pointer; transition: border-color .18s, color .18s; }
    .btn-outline:hover { border-color: rgba(255,255,255,.4); color: #fff; }
    .theme-toggle-btn { position: fixed; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 9px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; z-index: 50; }
    @media (max-width: 480px) {
      .actions { flex-direction: column; }
      .btn-primary, .btn-outline { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark theme"><span class="theme-toggle-icon">&#9728;&#65039;</span></button>

  <div class="card">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="CT Soccer">
    </a>
    <div class="code">404</div>
    <h1>Offside — this page doesn't exist</h1>
    <p>The page you're looking for was moved, renamed, or never existed. Let's get you back on the pitch.</p>
    <div class="actions">
      <a href="index.html" class="btn-primary">
        Back to Home
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h9M9 4l3.5 3.5L9 11"/></svg>
      </a>
      <a href="dashboard.html" class="btn-outline">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
